<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Grafiki: ile kosztuje wdrożenie AI</title>
<style>
@font-face{font-family:Anybody;src:url(../../../node_modules/@fontsource-variable/anybody/files/anybody-latin-ext-wdth-normal.woff2);font-weight:100 900;font-stretch:50% 150%}
@font-face{font-family:Anybody;src:url(../../../node_modules/@fontsource-variable/anybody/files/anybody-latin-wdth-normal.woff2);font-weight:100 900;font-stretch:50% 150%;unicode-range:U+0000-00FF}
@font-face{font-family:Onest;src:url(../../../node_modules/@fontsource-variable/onest/files/onest-latin-ext-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:Onest;src:url(../../../node_modules/@fontsource-variable/onest/files/onest-latin-wght-normal.woff2);font-weight:100 900;unicode-range:U+0000-00FF}
@font-face{font-family:"Spline Sans Mono";src:url(../../../node_modules/@fontsource-variable/spline-sans-mono/files/spline-sans-mono-latin-ext-wght-normal.woff2);font-weight:300 700}
@font-face{font-family:"Spline Sans Mono";src:url(../../../node_modules/@fontsource-variable/spline-sans-mono/files/spline-sans-mono-latin-wght-normal.woff2);font-weight:300 700;unicode-range:U+0000-00FF}
:root{--paper:#f4f5f1;--ink:#131412;--c:#EF7F1A;--y:#ffc400;--m:#d0201a}
*{box-sizing:border-box}body{margin:0;background:#fff;font:400 17px/1.4 Onest}
.graf{width:568px;margin:0 0 24px;padding:24px;border:2px solid var(--ink);background:var(--paper);display:grid;gap:14px}
.et{font:600 12px "Spline Sans Mono";letter-spacing:.04em;text-transform:uppercase}
.kr{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:12px 0;border-top:2px solid var(--ink)}
.kr:first-of-type{border-top:0}
.n{font:850 34px/1 Anybody;font-stretch:120%;background:var(--c);color:var(--ink);text-align:center;padding:6px 0}
.kr b{font:800 20px/1.2 Anybody;font-stretch:112%;display:block;margin-bottom:3px}
.kr span{font-size:16px}
.licz{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.licz div{border-top:6px solid var(--c);padding-top:10px}
.licz strong{font:850 24px/1.1 Anybody;font-stretch:115%;display:block;margin-bottom:6px}
.licz span{font-size:16px}
.duze{font:850 64px/1 Anybody;font-stretch:122%}
.kol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kol section{border:2px solid var(--ink);padding:14px}
.kol h3{margin:0 0 8px;font:800 20px/1.2 Anybody;font-stretch:112%}
.kol .tak h3{background:var(--c);margin:-14px -14px 10px;padding:10px 14px}
.kol .nie h3{background:var(--ink);color:var(--paper);margin:-14px -14px 10px;padding:10px 14px}
.kol ul{margin:0;padding-left:18px;font-size:16px}.kol li{margin:4px 0}
.mini{width:1128px;height:636px;transform-origin:0 0}
</style></head><body>
<figure class="graf" id="g1" style="margin-top:0"><div class="et">Ceny netto · najprostsza wersja</div>
<div class="kr"><div class="n">1</div><div><b>Prosta automatyzacja od 500 zł</b><span>Około 3 dni. Np. przypomnienie o niezapłaconej fakturze.</span></div></div>
<div class="kr"><div class="n">2</div><div><b>Voicebot od 2000 zł</b><span>2 tygodnie do pierwszych testów, plus około 20 USD/mies. za ElevenLabs.</span></div></div>
<div class="kr"><div class="n">3</div><div><b>Claude Code około 2000 zł</b><span>Wdrożenie u klienta razem ze szkoleniem zespołu.</span></div></div></figure>

<figure class="graf" id="g2"><div class="et">Moje ceny i cenniki rynku · 23.11.2026</div>
<div class="kol"><section class="tak"><h3>Moje ceny</h3><ul><li>automatyzacja od 500 zł netto</li><li>voicebot od 2000 zł netto</li><li>Claude Code ze szkoleniem około 2000 zł netto</li></ul></section>
<section class="nie"><h3>Cenniki rynku</h3><ul><li>automatyzacja 5 do 15 tys. zł netto (Herens)</li><li>voicebot 2990 zł plus 990 zł/mies. (odbierze.ai)</li><li>szkolenie jednej osoby od 1800 zł netto (SoftSolid)</li></ul></section></div></figure>

</body></html>
