<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Service page graphics (EN)</title>
<style>
@font-face{font-family:Anybody;src:url(../../../node_modules/@fontsource-variable/anybody/files/anybody-latin-ext-wdth-normal.woff2);font-weight:100 900;font-stretch:50% 150%}
@font-face{font-family:Anybody;src:url(../../../node_modules/@fontsource-variable/anybody/files/anybody-latin-wdth-normal.woff2);font-weight:100 900;font-stretch:50% 150%;unicode-range:U+0000-00FF}
@font-face{font-family:Onest;src:url(../../../node_modules/@fontsource-variable/onest/files/onest-latin-ext-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:Onest;src:url(../../../node_modules/@fontsource-variable/onest/files/onest-latin-wght-normal.woff2);font-weight:100 900;unicode-range:U+0000-00FF}
@font-face{font-family:"Spline Sans Mono";src:url(../../../node_modules/@fontsource-variable/spline-sans-mono/files/spline-sans-mono-latin-ext-wght-normal.woff2);font-weight:300 700}
@font-face{font-family:"Spline Sans Mono";src:url(../../../node_modules/@fontsource-variable/spline-sans-mono/files/spline-sans-mono-latin-wght-normal.woff2);font-weight:300 700;unicode-range:U+0000-00FF}
:root{--paper:#f4f5f1;--ink:#131412;--c:#EF7F1A;--y:#ffc400;--m:#d0201a}
*{box-sizing:border-box}body{margin:0;background:#fff;font:400 17px/1.4 Onest}
.graf{width:568px;margin:0 0 24px;padding:24px;border:2px solid var(--ink);background:var(--paper);display:grid;gap:14px}
.et{font:600 12px "Spline Sans Mono";letter-spacing:.04em;text-transform:uppercase}
.kr{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:12px 0;border-top:2px solid var(--ink)}
.kr:first-of-type{border-top:0}
.n{font:850 34px/1 Anybody;font-stretch:120%;background:var(--c);color:var(--ink);text-align:center;padding:6px 0}
.kr b{font:800 20px/1.2 Anybody;font-stretch:112%;display:block;margin-bottom:3px}
.kr span{font-size:16px}
.licz{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.licz div{border-top:6px solid var(--c);padding-top:10px}
.licz strong{font:850 24px/1.1 Anybody;font-stretch:115%;display:block;margin-bottom:6px}
.licz span{font-size:16px}
.duze{font:850 64px/1 Anybody;font-stretch:122%}
.kol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kol section{border:2px solid var(--ink);padding:14px}
.kol h3{margin:0 0 8px;font:800 20px/1.2 Anybody;font-stretch:112%}
.kol .tak h3{background:var(--c);margin:-14px -14px 10px;padding:10px 14px}
.kol .nie h3{background:var(--ink);color:var(--paper);margin:-14px -14px 10px;padding:10px 14px}
.kol ul{margin:0;padding-left:18px;font-size:16px}.kol li{margin:4px 0}
.mini{width:1128px;height:636px;transform-origin:0 0}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flow div{border:2px solid var(--ink);background:#fff;padding:12px}
.flow div.ak{background:var(--c)}
.flow b{font:800 18px/1.2 Anybody;font-stretch:112%;display:block;margin-bottom:4px}
.flow span{font-size:15px}
.akc{max-width:900px;font-size:16px}.akc h2{font:800 24px Anybody;margin:32px 0 8px}
.akc table{border-collapse:collapse;width:100%}.akc td,.akc th{border:1px solid #999;padding:8px;vertical-align:top;text-align:left}
</style></head><body>

<!-- VOICEBOTY -->
<figure class="graf" id="voiceboty-en-1" style="margin-top:0"><div class="et">AI voice agent · from form to CRM</div>
<div class="kr"><div class="n">1</div><div><b>Form on your site</b><span>A person fills out the contact form on your site.</span></div></div>
<div class="kr"><div class="n">2</div><div><b>The bot calls within 2 minutes</b><span>It introduces itself as an AI assistant and asks if it may continue.</span></div></div>
<div class="kr"><div class="n">3</div><div><b>Qualifying questions</b><span>The bot finds out the client's need and budget.</span></div></div>
<div class="kr"><div class="n">4</div><div><b>Note in the CRM</b><span>n8n saves the note on the deal in Pipedrive.</span></div></div></figure>

<figure class="graf" id="voiceboty-en-2"><div class="et">The voice agent gathers info, the sales rep sells</div>
<div class="kol"><section class="tak"><h3>The bot does</h3><ul><li>calls back website inquiries</li><li>asks qualifying questions</li><li>writes a note for the sales rep</li><li>passes on dropped calls and requests for another time</li></ul></section>
<section class="nie"><h3>The bot doesn't</h3><ul><li>sell</li><li>negotiate</li><li>run the sales call: the sales rep does</li></ul></section></div></figure>

<!-- AI I AUTOMATYZACJA -->
<figure class="graf" id="ai-i-automatyzacja-en-1"><div class="et">AI implementation · process first</div>
<div class="kr"><div class="n">1</div><div><b>I check how the work looks today</b><span>Often it's enough to lay out the process properly.</span></div></div>
<div class="kr"><div class="n">2</div><div><b>A simple automation</b><span>n8n or Make.com, from PLN 500 plus VAT, about 3 days.</span></div></div>
<div class="kr"><div class="n">3</div><div><b>An AI agent where it saves work</b><span>It reads documents, pulls out data, and passes cases on.</span></div></div>
<div class="kr"><div class="n">4</div><div><b>A person makes the call</b><span>When the model might be wrong, a designated person confirms.</span></div></div></figure>

<figure class="graf" id="ai-i-automatyzacja-en-2"><div class="et">Grant application workflow</div>
<div class="flow"><div><b>Email and SharePoint</b><span>Documents pulled in every day</span></div><div><b>OCR and a language model</b><span>Reading the application</span></div>
<div><b>Airtable</b><span>Amounts, deadlines, counterparty details, and the case owner</span></div><div class="ak"><b>Unsure reading?</b><span>The system asks a designated person to confirm</span></div></div></figure>

<!-- STRONY I APLIKACJE -->
<figure class="graf" id="strony-i-aplikacje-en-1"><div class="et">A custom website or app</div>
<div class="kr"><div class="n">1</div><div><b>Off-the-shelf tools first</b><span>I build custom when off-the-shelf software falls short or costs too much.</span></div></div>
<div class="kr"><div class="n">2</div><div><b>Code with Claude Code</b><span>WordPress, Astro, Next.js, and apps in Python and React.</span></div></div>
<div class="kr"><div class="n">3</div><div><b>Migration and handoff</b><span>I keep the old site's look and working URLs.</span></div></div></figure>

<figure class="graf" id="strony-i-aplikacje-en-2"><div class="et">From client projects</div>
<div class="licz"><div><strong>89 URLs</strong><span>kept after moving from WordPress to Astro</span></div><div><strong>12 trainers</strong><span>each with her own calendar in the training app</span></div><div><strong>60 hours</strong><span>less manual work per month, according to the owner</span></div></div></figure>

<!-- CLAUDE CODE TRAINING -->
<figure class="graf" id="szkolenie-claude-code-en-1"><div class="et">Claude Code training · setup for your business</div>
<div class="kr"><div class="n">1</div><div><b>Setup and knowledge base</b><span>Claude Code for your company and knowledge of how you work and how you write to clients.</span></div></div>
<div class="kr"><div class="n">2</div><div><b>Four skills for your tasks</b><span>Each on a model that fits the work, so you don't burn tokens.</span></div></div>
<div class="kr"><div class="n">3</div><div><b>Team training</b><span>Remote or at your office, about PLN 2,000 plus VAT for everything.</span></div></div></figure>

<figure class="graf" id="szkolenie-claude-code-en-2"><div class="et">What I teach in the training</div>
<div class="kol"><section class="tak"><h3>Put in</h3><ul><li>knowledge about the company and how you work</li><li>the way you write to clients</li><li>anonymized documents</li></ul></section>
<section class="nie"><h3>Keep out</h3><ul><li>client data</li><li>passwords</li><li>contracts</li><li>documents with sensitive data that hasn't been anonymized</li></ul></section></div></figure>

</body></html>
