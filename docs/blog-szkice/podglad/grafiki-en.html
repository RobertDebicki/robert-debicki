<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>English graphics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Onest:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>/* Podgląd wpisów: tokeny i typografia jak w src/styles/tokeny.css i makiecie. */
:root {
  --paper: #f4f5f1; --ink: #131412; --muted: #555850; --rule: #131412;
  --c: #EF7F1A; --m: #d0201a; --y: #ffc400; --spot: #ffc400;
  --font-display: "Anybody", "Arial Black", Arial, sans-serif;
  --font-body: "Onest", "Helvetica Neue", Arial, sans-serif;
  --font-data: "Spline Sans Mono", ui-monospace, Menlo, monospace;
  --s--1: 0.75rem; --s-0: 1.0625rem; --s-2: clamp(1.7rem, 3.4vw, 2.6rem); --s-3: clamp(2.2rem, 5vw, 3.6rem);
  --linia: color-mix(in srgb, var(--ink) 25%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0f100e; --ink: #f0f1ea; --muted: #a6a99d; --rule: #f0f1ea; --m: #ff5442; --y: #ffcf3a; --spot: #ffcf3a; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #0f100e; --ink: #f0f1ea; --muted: #a6a99d; --rule: #f0f1ea; --m: #ff5442; --y: #ffcf3a; --spot: #ffcf3a; color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--s-0)/1.6 var(--font-body); padding-inline: 16px; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-data); font-size: var(--s--1); letter-spacing: 0.02em; }

.top { position: sticky; top: 0; z-index: 20; margin-inline: -16px; background: var(--paper); border-bottom: 1.5px solid var(--rule); }
.bar { display: grid; grid-template-columns: repeat(16, 1fr); height: 10px; }
.bar i:nth-child(4n+1) { background: var(--c); } .bar i:nth-child(4n+2) { background: var(--m); }
.bar i:nth-child(4n+3) { background: var(--y); } .bar i:nth-child(4n) { background: var(--ink); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 24px; padding: 12px 16px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }

.sheet { max-width: 1180px; margin: 0 auto; }
section { padding-block: 72px; border-top: 1.5px solid var(--rule); }
section:first-child { border-top: 0; }
.label { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.label::before { content: ""; width: 14px; height: 14px; background: var(--sw, var(--pl)); }
.sec-title { font-size: var(--s-2); font-weight: 820; font-variation-settings: "wdth" 118; line-height: 1.05; letter-spacing: -0.02em; max-width: 18em; overflow-wrap: anywhere; }
.sec-intro { margin-top: 16px; color: var(--muted); max-width: 40em; }

.spis { list-style: none; padding: 0; margin: 36px 0 0; display: grid; gap: 0; max-width: 46em; }
.spis li { border-top: 2px solid var(--ink); }
.spis a { display: grid; gap: 4px; padding: 14px 0 18px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.2; }
.spis a .mono { color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.spis a .mono::before { content: ""; width: 10px; height: 10px; background: var(--pl); }
.spis a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }

.wpis header time { display: block; margin-top: 14px; color: var(--muted); }
.google { margin-top: 24px; max-width: 40em; border-left: 4px solid var(--pl); padding: 4px 0 4px 14px; display: grid; gap: 4px; color: var(--muted); font-size: 0.8rem; }
.google span { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.7rem; }
.google b { color: var(--ink); font-family: var(--font-body); font-size: 1.05rem; }

.wpis-tresc { margin-top: 40px; max-width: 46rem; }
.wpis-tresc > * + * { margin-top: 1.1em; }
.wpis-tresc h2 { margin-top: 2.2em; font-size: 1.55rem; font-weight: 800; font-variation-settings: "wdth" 112; line-height: 1.15; }
.wpis-tresc .wstep { font-size: 1.22rem; line-height: 1.5; }
.wpis-tresc strong { background: linear-gradient(transparent 62%, color-mix(in srgb, var(--pl) 45%, transparent) 62%); }
.wpis-tresc a { text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--pl); }
.lista { padding-left: 2.2em; } .lista li + li { margin-top: 6px; }
.lista li::marker { font-family: var(--font-data); font-weight: 600; }
.wroc { margin-top: 48px; }

/* FAQ */
.faq { border-top: 2px solid var(--ink); }
.faq details { border-bottom: 1px solid var(--linia); }
.faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; line-height: 1.3; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--font-data); font-size: 1.4rem; line-height: 1; color: var(--pl); }
.faq details[open] summary::after { content: "−"; }
.faq details p { padding: 0 0 18px; max-width: 40em; }

/* Grafiki */
.graf { margin: 2em 0 0; padding: 22px; border: 2px solid var(--ink); background: var(--paper); box-shadow: 6px 6px 0 var(--pl); display: grid; gap: 18px; }
.graf figcaption { color: var(--muted); font-size: 0.9rem; }
.graf .alt { color: var(--muted); border-top: 1px dashed var(--linia); padding-top: 10px; font-size: 0.7rem; }
.graf-tyt { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.duza { font-family: var(--font-display); font-weight: 850; font-variation-settings: "wdth" 115; font-size: var(--s-3); line-height: 0.95; letter-spacing: -0.02em; }

.czat { border: 2px solid var(--ink); max-width: 26rem; display: grid; gap: 10px; padding: 0 14px 16px; }
.czat-gora { margin-inline: -14px; padding: 8px 14px; background: var(--ink); color: var(--paper); display: flex; align-items: center; gap: 8px; }
.kropka { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.dymek { max-width: 85%; padding: 10px 14px; border: 2px solid var(--ink); line-height: 1.4; font-size: 0.98rem; }
.dymek.bot { justify-self: start; border-radius: 2px 14px 14px 14px; }
.dymek.bot:first-of-type { background: var(--y); color: #131412; border-color: #131412; }
.dymek.klient { justify-self: end; background: var(--ink); color: var(--paper); border-radius: 14px 2px 14px 14px; }
.czat-opis { display: grid; gap: 6px; max-width: 30em; }
.czat-opis .mono { color: var(--muted); }

.os, .minuty { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
.minuty { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.os li, .minuty li { position: relative; display: grid; gap: 4px; align-content: start; padding: 26px 14px 4px 0; border-top: 4px solid var(--ink); }
.os li::before, .minuty li::before { content: ""; position: absolute; top: -12px; left: 0; width: 18px; height: 18px; border: 3px solid var(--ink); background: var(--paper); border-radius: 50%; }
.os li.teraz::before, .minuty li.teraz::before { background: var(--c); border-color: var(--c); }
.os li.teraz b, .minuty li.teraz b { background: var(--y); color: #131412; padding: 0 4px; justify-self: start; }
.os li.pozniej { border-top-style: dashed; color: var(--muted); }
.os b, .minuty b { font-family: var(--font-display); font-size: 0.98rem; font-variation-settings: "wdth" 100; justify-self: start; }
.os span, .minuty span { font-size: 0.9rem; line-height: 1.35; }
.os time, .minuty time { color: var(--muted); }

.dwie { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 14px; }
.kol { border: 2px solid var(--ink); padding: 14px 16px; }
.kol.ty { background: var(--ink); color: var(--paper); }
.kol .mono { text-transform: uppercase; letter-spacing: 0.08em; }
.kol ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.kol li { display: flex; gap: 10px; line-height: 1.35; }
.kol li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 0.4em; background: var(--pl); }

.kroki { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 14px; }
.kroki li { border-top: 4px solid var(--ink); padding-top: 12px; display: grid; gap: 4px; align-content: start; }
.kroki li.wazne { border-top-color: var(--m); }
.kroki .nr { font-family: var(--font-display); font-weight: 850; font-size: 2.4rem; line-height: 1; color: var(--pl); }
.kroki li.wazne .nr { color: var(--m); }
.kroki b { font-family: var(--font-display); font-size: 1.1rem; }
.kroki span:last-child { font-size: 0.95rem; line-height: 1.4; }
.kara { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-top: 14px; border-top: 1px solid var(--linia); }
.kara span:last-child { max-width: 26em; line-height: 1.4; }

.slupki { display: grid; gap: 10px; }
.slupki .rz { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) 4rem; align-items: center; gap: 12px; }
.slupki .etk { font-size: 0.95rem; }
.slupki .tor { height: 22px; }
.slupki .sl { display: block; height: 100%; background: color-mix(in srgb, var(--ink) 30%, var(--paper)); border-radius: 0 4px 4px 0; }
.slupki .sl.pl { background: var(--c); }
.slupki .rz:first-child .etk, .slupki .rz:first-child .wart { font-weight: 700; }
.slupki .rz:hover .sl { outline: 2px solid var(--ink); outline-offset: 2px; }
.slupki .wart { text-align: right; font-size: 0.85rem; }

.liczby { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 18px; }
.liczby div { display: grid; gap: 8px; align-content: start; padding-bottom: 8px; background: linear-gradient(var(--pl), var(--pl)) left top / 1.4em 5px no-repeat; padding-top: 16px; }
.liczby div span:last-child { line-height: 1.4; font-size: 0.95rem; }

.przeplyw { display: grid; gap: 0; justify-items: stretch; }
.wezel { border: 2px solid var(--ink); padding: 10px 14px; display: grid; gap: 2px; background: var(--paper); }
.wezel .mono { color: var(--muted); }
.wezel b { font-family: var(--font-display); font-size: 1.05rem; }
.wezel span:last-child { font-size: 0.9rem; color: var(--muted); }
.strz { height: 28px; width: 2px; background: var(--ink); justify-self: center; position: relative; }
.strz::after { content: ""; position: absolute; bottom: -2px; left: -6px; border: 7px solid transparent; border-top: 9px solid var(--ink); border-bottom: 0; }
.rozwidlenie { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 14px; }
.wezel.ok { border-color: var(--ink); box-shadow: inset 6px 0 0 var(--c); padding-left: 20px; }
.wezel.czlowiek { background: var(--y); color: #131412; border-color: #131412; }
.wezel.czlowiek .mono, .wezel.czlowiek span:last-child { color: #3a3b36; }

.potw { display: grid; grid-template-columns: minmax(7rem, 11rem) minmax(0, 1fr); gap: 18px; align-items: start; }
.skan { aspect-ratio: 3 / 4; border: 2px solid var(--ink); padding: 14px 12px; display: grid; gap: 10px; align-content: start; }
.skan i { display: block; height: 7px; background: color-mix(in srgb, var(--ink) 22%, transparent); }
.skan i.kr { width: 60%; }
.pola { margin: 0; display: grid; gap: 0; }
.pola > div { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--linia); }
.pola dt { color: var(--muted); }
.pola dd { margin: 0; font-weight: 600; }
.pola .niep dd { background: color-mix(in srgb, var(--y) 55%, transparent); padding: 0 6px; justify-self: start; }
.pola .niep em { font-style: normal; color: var(--m); margin-left: 6px; }
.pola .przyc { display: flex; flex-wrap: wrap; gap: 10px; border: 0; padding-top: 14px; }
.btn { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; font-weight: 600; border: 2px solid var(--ink); background: var(--paper); box-shadow: 4px 4px 0 var(--c); }
.btn.solid { background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 var(--m); }

.ticket { border: 2px solid var(--ink); font-size: 0.95rem; max-width: 30rem; }
.ticket header { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--ink); color: var(--paper); }
.ticket dl { margin: 0; }
.ticket dl div { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 12px; padding: 10px 14px; border-top: 1px solid var(--linia); }
.ticket dl div:first-child { border-top: 0; }
.ticket dt { color: var(--muted); }
.ticket dd { margin: 0; font-weight: 600; }

.licznik { display: grid; gap: 12px; }
.licznik .rz { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) 7.5rem; align-items: center; gap: 12px; }
.licznik b { font-family: var(--font-display); font-size: 1.1rem; }
.kw { display: grid; grid-template-columns: repeat(5, minmax(0, 2.6rem)); gap: 6px; }
.kw i { display: block; height: 2.2rem; border: 2px solid var(--ink); }
.kw i.p { background: color-mix(in srgb, var(--ink) 30%, var(--paper)); }
.n8n .kw i.p { background: var(--c); }
.kw i.cale { grid-column: 1 / -1; }
.licznik .mono { font-size: 0.85rem; font-weight: 600; }

.tab-wrap { overflow-x: auto; }
.tab { width: 100%; border-collapse: collapse; font-size: 0.95rem; min-width: 30rem; }
.tab th, .tab td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linia); vertical-align: top; }
.tab thead th { font-family: var(--font-display); font-size: 1.05rem; border-bottom: 2px solid var(--ink); }
.tab thead th:last-child { background: var(--c); color: #131412; }
.tab tbody th { font-weight: 600; color: var(--muted); }

@media (max-width: 560px) {
  .graf { padding: 16px; box-shadow: 4px 4px 0 var(--pl); }
  .potw { grid-template-columns: 1fr; } .skan { max-width: 9rem; }
  .slupki .rz { grid-template-columns: 6rem minmax(0, 1fr) 3.4rem; gap: 8px; }
  .licznik .rz { grid-template-columns: 1fr; gap: 6px; }
}

@media (max-width: 760px) {
  .os, .minuty { grid-template-columns: 1fr; }
  .os li, .minuty li { border-top: 0; border-left: 4px solid var(--ink); padding: 4px 0 18px 22px; }
  .os li.pozniej { border-left-style: dashed; }
  .os li::before, .minuty li::before { top: 4px; left: -11px; }
}

/* Lista wpisów z miniaturkami */
.karty { margin-top: 40px; display: grid; gap: 0; max-width: 60rem; }
.karta { display: grid; grid-template-columns: minmax(0, 20rem) minmax(0, 1fr); gap: 18px 32px; align-items: start; padding-block: 28px; border-top: 2px solid var(--ink); }
.mini { display: block; border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); transition: transform .15s, box-shadow .15s; }
.mini svg { display: block; width: 100%; height: auto; }
.karta:hover .mini { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--pl); }
.karta time { color: var(--muted); }
.karta h3 { margin-top: 6px; font-size: 1.45rem; font-weight: 800; font-variation-settings: "wdth" 112; line-height: 1.15; overflow-wrap: anywhere; }
.karta h3 a { text-decoration: none; }
.karta:hover h3 a { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--pl); }
.karta p { margin-top: 10px; color: var(--muted); max-width: 36em; }
@media (max-width: 640px) { .karta { grid-template-columns: 1fr; } }
